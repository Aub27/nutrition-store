# Frontend container: serves the Angular build and proxies the API.
# Because the SPA and the API share one origin, the admin session cookie is SameSite=Strict and CORS is not needed.

# Global abuse limits (the API has its own per-IP limiter too).
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=orders:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=300r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;

# Trust the client address forwarded by the TLS proxy (Caddy) inside the Docker network only.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 6m;       # image uploads (the API enforces 5 MB)
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    limit_conn perip 40;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Security headers (repeated in each location that sets its own add_header) ──
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # ── API ───────────────────────────────────────────────────────────────
    location = /api/v1/admin/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_pass http://backend:8000;
    }

    location = /api/v1/orders {
        limit_req zone=orders burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_pass http://backend:8000;
    }

    location /api/ {
        limit_req zone=api burst=100 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_pass http://backend:8000;
    }

    # Uploaded product images (served by the API, re-encoded WebP only).
    location /media/ {
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_pass http://backend:8000;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # ── Static assets: hashed file names can be cached forever ─────────────
    location ~* \.(?:js|css|woff2|png|jpg|jpeg|webp|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    # ── SPA fallback (never cache the shell so new deploys show up immediately) ──
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    # Block dotfiles and source maps.
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.map$ { deny all; }
}
